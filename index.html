<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A quiet, offline workout tracker for logging sets, rests and progress.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <title>Workout Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&amp;family=Barlow:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot" role="status" aria-label="Loading Workout Tracker">
      <span class="boot-ring" aria-hidden="true"></span>
    </div>
  </div>
  <div id="app-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <p class="noscript">Workout Tracker needs JavaScript enabled to run.</p>
  </noscript>
</body>
</html>
